pylon:root_advancement:
  display-info:
    icon:
      item: pylon:bronze_anvil
      count: 1
    show-toast: false
    announce-to-chat: false
    hidden: false
    # The texture tiled behind this advancement's tab, without the textures/ prefix or .png suffix. Only used on root advancements.
    background: minecraft:gui/advancements/backgrounds/adventure
  criteria:
    - criteria1:
      - rebar:unlock_on_join
pylon:random_advancement:
  # The parent of this advancement in the tree
  parent: pylon:root_advancement
  display-info:
    icon:
      # Namespaced key pointing to the item to use for the icon of the advancement (can be either vanilla or rebar item)
      item: pylon:beheading_sword
      count: 1
    # Whether to show the toast in the top-right when its unlocked
    show-toast: true
    # Whether to send the chat message that the advancement has been unlocked
    announce-to-chat: true
    # Whether the advancement can be viewed in the tree
    hidden: false
    # The frame around the icon of the advancement
    frame: challenge
  criteria:
    - criteria1:
      - rebar:unlock_on_item:
          item: pylon:beheading_sword
  # What is unlocked upon completion
  rewards:
    rebar:grant_experience:
      # amount of xp to grant
      amount: 10
